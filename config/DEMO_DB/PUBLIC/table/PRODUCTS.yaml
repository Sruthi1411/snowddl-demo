columns:
  PRODUCT_ID:
    type: VARCHAR(36)
    not_null: true
    comment: "Unique product identifier"
  PRODUCT_NAME:
    type: VARCHAR(255)
    comment: "Product display name"
  PRICE:
    type: NUMBER(10,2)
    comment: "Price in USD"
  CATEGORY:
    type: VARCHAR(100)
    comment: "Product category"
  CREATED_AT:
    type: TIMESTAMP_NTZ(9)
    not_null: true
    comment: "Record creation timestamp"

primary_key:
  - PRODUCT_ID

comment: "Demo products table — managed by SnowDDL"